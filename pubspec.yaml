name: masked_contact_dialer
description: A privacy-oriented contact management app with masked display numbers and real call routing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.1
  local_auth: ^2.1.8
  flutter_riverpod: ^2.4.9
  uuid: ^4.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  glados: ^1.1.1
  mocktail: ^1.0.2

flutter:
  uses-material-design: true
